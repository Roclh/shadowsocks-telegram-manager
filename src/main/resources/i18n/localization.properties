  any regulations.\n\n\
  To use it you need to download additional file for \
  <a href="https://github.com/shadowsocks/v2ray-plugin/releases/download/v1.3.2/v2ray-plugin-windows-amd64-v1.3.2.tar.gz">windows</a> \
  or <a href="https://play.google.com/store/apps/details?id=com.github.shadowsocks.plugin.v2ray&pcampaignid=web_share">android</a>, \
  unzip it and drop it to shadowsocks program folder. After that you should select your plugin in bot, going by access -> select plugin -> v2ray.\
  from now generated qr code will include using plugin, and you will be available to access your server only with plugin enabled.

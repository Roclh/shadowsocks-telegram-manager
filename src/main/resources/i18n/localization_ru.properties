command.support.pluginguide.how.to.use.plugins.guide.v2ray=Плагин V2Ray - плагин, который улучшает безопасность протокола shadowsocks, чтобы обойти практически \
любые правила.\n\n\
Чтобы использовать его, вам нужно скачать дополнительный файл для \
<a href="https://github.com/shadowsocks/v2ray-plugin/releases/download/v1.3.2/v2ray-plugin-windows-amd64-v1.3.2.tar.gz">Windows</a> \
или <a href="https://play.google.com/store/apps/details?id=com.github.shadowsocks.plugin.v2ray&pcampaignid=web_share">Android</a>, \
распакуйте его и поместите в папку программы shadowsocks. После этого вам следует выбрать ваш плагин в боте, перейдя по пути access -> select plugin -> v2ray.\
с этого момента сгенерированный QR-код будет включать использование плагина, и вы сможете получить доступ к своему серверу только при включенном плагине.

command.common.guide.pc=Для запуска pvpn на PC необходимо:\
  \ \n1. Скачать приложение Shadowsocks по <a href='https://github.com/shadowsocks/shadowsocks-windows/releases/tag/4.4.1.0'>ссылке</a>\
  \ \n2. Скопировать текст под QR кодом, который присылает наш бот\
  \ \n3. Запустить приложение\
  \ \n4. Выбрать "Серверы > Импорт адреса из буфера обмена"\
  \ \n5. Выбрать сервер, который был только что добавлен во вкладку "Серверы"\
  \ \n6. Выбрать "Системный прокси-сервер > Сценарий настройки (PAC)" или "Системный прокси-сервер > Для всей системы"\
  \ \n\nГотово! Теперь можете проверить, запустив YouTube. Слева сверху должны появиться буквы LV вместо RU
